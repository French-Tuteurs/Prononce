<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>IPA Path | Prononce</title>

    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="icons/icon-16.png">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <link rel="manifest" href="site.webmanifest">

    <meta name="theme-color" content="#14213d">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Prononce">

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Playfair+Display:wght@500;600;700&display=swap"
        rel="stylesheet"
    >

</head>


<body class="lesson-page ipa-path-level-page">

    <div class="page-loader" id="page-loader">
        <img src="favicon.svg" alt="" class="page-loader-mark">
        <div class="page-loader-spinner"></div>
    </div>


    <header class="site-header">

        <a href="dashboard.html" class="logo">Prononce</a>

        <nav class="main-nav">
            <a href="dashboard.html">Dashboard</a>
            <a href="#" data-tooltip="Coming Soon">Practice</a>
            <a href="progress.html">Progress</a>
        </nav>

        <div class="user-menu" id="user-menu">
            <button
                type="button"
                class="user-menu-trigger"
                id="user-menu-trigger"
                aria-haspopup="true"
                aria-expanded="false"
                aria-label="Account menu"
            >
                <svg class="user-menu-icon" viewBox="0 0 24 24" aria-hidden="true">
                    <circle cx="12" cy="8" r="4"></circle>
                    <path d="M4 20c0-4.4 3.6-8 8-8s8 3.6 8 8"></path>
                </svg>
            </button>
            <div class="user-menu-dropdown" id="user-menu-dropdown">
                <a href="settings.html" class="user-menu-item">Account Settings</a>
                <button type="button" class="user-menu-item user-menu-logout" id="logout-button">Log Out</button>
            </div>
        </div>

    </header>


    <main class="lesson-container">

        <a href="ipa-path.html" class="back-link">← Back to Path</a>

        <section class="lesson-intro">
            <p class="eyebrow" id="ipa-level-eyebrow">IPA Path</p>
            <h1 id="ipa-level-title">Loading…</h1>
        </section>


        <div class="lesson-progress">
            <div class="lesson-progress-top">
                <span id="ipa-level-progress-label">Progress</span>
                <span id="ipa-level-progress-text">0%</span>
            </div>
            <div class="progress-bar">
                <div class="progress-fill" id="ipa-level-progress-fill" style="width: 0%;"></div>
            </div>
        </div>


        <!-- Intro / prose-only levels -->
        <div class="lesson-section hidden" id="ipa-level-intro-view">
            <div id="ipa-level-intro-text"></div>
            <button class="lesson-next" id="ipa-level-intro-continue">Continue</button>
        </div>


        <!-- Teach: one sound-card plus a couple more real-word examples,
             then "continue to check" -->
        <div class="lesson-section hidden" id="ipa-level-teach-view">
            <p class="eyebrow" id="ipa-level-teach-category"></p>
            <div class="sound-card ipa-sound-card" id="ipa-level-teach-card">
                <span class="sound-symbol" id="ipa-level-teach-symbol"></span>
                <div>
                    <h3 id="ipa-level-teach-heading"></h3>
                    <p id="ipa-level-teach-description"></p>
                    <div class="practice-buttons">
                        <button class="audio-button listen-button" id="ipa-level-teach-listen">▶ Listen</button>
                    </div>
                </div>
            </div>
            <p class="ipa-teach-more-label">A couple more words with the same sound:</p>
            <div class="ipa-teach-more" id="ipa-level-teach-more"></div>
            <button class="lesson-next" id="ipa-level-teach-continue">Continue to Check</button>
        </div>


        <!-- Quiz: teach-check, drill, review, milestone, final all share this -->
        <div class="ipa-practice-stage hidden" id="ipa-level-quiz-view">
            <p class="practice-question-counter">
                Question <span id="ipa-level-current">1</span> of <span id="ipa-level-total">1</span>
            </p>
            <div id="ipa-level-question-holder"></div>
            <button class="practice-next-question" id="ipa-level-next" type="button" disabled>Next Question &rarr;</button>
        </div>


        <!-- Level-complete summary -->
        <div class="completion-section hidden" id="ipa-level-summary-view">
            <p class="eyebrow">Level Complete</p>
            <div class="completion-icon">✓</div>
            <h2>Très bien !</h2>
            <p id="ipa-level-summary-text"></p>
            <div class="lesson-nav-buttons">
                <a href="ipa-path.html" class="lesson-card-button" id="ipa-level-next-level">Continue</a>
                <a href="dashboard.html" class="dashboard-link">Back to Dashboard</a>
            </div>
        </div>

    </main>


    <script type="module" src="script.js"></script>
    <script type="module" src="ipa-path-level.js"></script>

</body>

</html>
